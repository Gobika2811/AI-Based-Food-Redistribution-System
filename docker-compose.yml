version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: resqfood_postgres
    restart: always
    environment:
      POSTGRES_DB: resqfood
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: resqfood_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resqfood_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:adminpassword123@db:5432/resqfood
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai-service:8001
      - APP_ENV=production
      - SECRET_KEY=supersecretjwtsecretkeychangeinproduction123!
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resqfood_celery_worker
    command: celery -A tasks.celery_app worker --loglevel=info -P gevent
    environment:
      - DATABASE_URL=postgresql://postgres:adminpassword123@db:5432/resqfood
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai-service:8001
    depends_on:
      - db
      - redis

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: resqfood_ai_service
    restart: always
    environment:
      - APP_ENV=production
    ports:
      - "8001:8001"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resqfood_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
